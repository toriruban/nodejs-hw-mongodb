tags:
  - Contacts
summary: Get list of contacts
operationId: getAllContacts
description: Returns a paginated list of contacts for the authenticated user.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema: { type: integer, minimum: 1, default: 1 }
    description: Page number
    example: 1
  - in: query
    name: perPage
    schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    description: Number of contacts per page
    example: 10
  - in: query
    name: sortBy
    schema: { type: string, enum: [name, phoneNumber, contactType, createdAt] }
    description: Field to sort by
    example: name
  - in: query
    name: sortOrder
    schema: { type: string, enum: [asc, desc], default: asc }
    description: Sorting order
    example: asc
  - in: query
    name: filter
    schema: { type: string, enum: [work, home, personal] }
    description: Filter contacts by type
    example: work
responses:
  '200':
    description: Successfully retrieved contacts list
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data, page, perPage, filter, totalItems, totalPages, hasNextPage, hasPreviousPage]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Contacts retrieved successfully"
            data:
              type: array
              items:
                $ref: '../../components/schemas/contacts.yaml'
            page:
              type: integer
              example: 1
            perPage:
              type: integer
              example: 10
            filter:
              type: string
              example: "work"
            totalItems:
              type: integer
              example: 42
            totalPages:
              type: integer
              example: 5
            hasNextPage:
              type: boolean
              example: true
            hasPreviousPage:
              type: boolean
              example: false
  '401':
    $ref: '../../components/responses/401.yaml'
