tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Creates a new contact for the authenticated user. You can also upload a photo.
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            description: Contact name
            example: "Vikky"
          phoneNumber:
            type: string
            description: Contact phone number
            example: "+380991112233"
          email:
            type: string
            format: email
            description: Contact email (optional)
            example: "vikky@example.com"
          isFavourite:
            type: boolean
            default: false
            description: Mark as favourite
          contactType:
            type: string
            enum: [work, home, personal]
            default: personal
            description: Category of contact
          photo:
            type: string
            format: binary   
            description: Upload photo file
responses:
  '201':
    $ref: '../../components/responses/201.yaml'
  '400':
    description: Validation error (missing required fields or invalid data)
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    description: Internal server error
