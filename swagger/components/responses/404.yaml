description: Contact not found.
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: "Contact not found"
        data:
          nullable: true
          example: null
    examples:
      notFound:
        value:
          status: 404
          message: "Contact not found"
          data: null